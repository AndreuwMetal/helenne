<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda – Helenne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500&family=Proza+Libre:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

  <header class="site-header">
    <div class="site-header__wrapper">

      <nav class="site-header__nav" aria-label="Principal">
        <button class="icon-btn menu-toggle" aria-label="Menú">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M2 5h16M2 10h16M2 15h16"/>
          </svg>
        </button>
        <ul class="site-nav">
          <li><a class="site-nav__link is-active" href="tienda.html">Tienda</a></li>
          <li><a class="site-nav__link" href="personalizar.html" data-es="Personalizar" data-en="Personalice">Personalizar</a></li>
        </ul>
      </nav>

      <a class="site-header__logo" href="index.html">
        <span class="site-header__logo-name">Helenne</span>
        <span class="site-header__logo-tagline">handmade</span>
      </a>

      <div class="site-header__icons">

        <div class="lang-switcher" id="langSwitcher">
          <button class="lang-switcher__toggle" aria-haspopup="listbox" aria-expanded="false">
            <span data-lang-label>Español</span>
            <svg viewBox="0 0 10 6" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.2">
              <path d="M1 1l4 4 4-4"/>
            </svg>
          </button>
          <div class="lang-switcher__list">
            <a href="#" data-lang="Español">Español</a>
            <a href="#" data-lang="English">English</a>
          </div>
        </div>

        <a class="icon-btn js-open-search" href="#" aria-label="Buscar">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="9" cy="9" r="6"/>
            <path d="M13.5 13.5L18 18"/>
          </svg>
          <span class="visually-hidden">Buscar</span>
        </a>

        <a class="icon-btn js-open-cart" href="#" aria-label="Carrito">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M3.5 6h13l-1 11.5h-11L3.5 6z"/>
            <path d="M7 8V5a3 3 0 0 1 6 0v3"/>
          </svg>
          <span class="visually-hidden">Carrito</span>
        </a>

      </div>
    </div>
  </header>

  <main>
    <h1 class="page-title">Tienda</h1>

    <div class="collection-grid">

      <a class="collection-card" href="accesorios.html">
        <div class="collection-card__media">
          <img src="https://images.unsplash.com/photo-1606417465691-cd430ee3f624?w=900&h=900&q=80&auto=format&fit=crop" alt="Accesorios — estuche de tela hecho a mano">
        </div>
        <span class="collection-card__title">Accesorios</span>
      </a>

      <a class="collection-card" href="ropa.html">
        <div class="collection-card__media">
          <img src="https://images.unsplash.com/photo-1501127122-f385ca6ddd9d?w=900&h=900&q=80&auto=format&fit=crop" alt="Ropa — prenda natural colgada junto a una ventana">
        </div>
        <span class="collection-card__title">Ropa</span>
      </a>

      <a class="collection-card" href="ceramica.html">
        <div class="collection-card__media">
          <img src="https://images.unsplash.com/photo-1631125915902-d8abe9225ff2?w=900&h=900&q=80&auto=format&fit=crop" alt="Cerámica — vasijas de barro sobre mesa clara">
        </div>
        <span class="collection-card__title">Cerámica</span>
        <span class="collection-card__badge">Próximamente</span>
      </a>

    </div>
  </main>

  <script src="site.js?v=4"></script>

</html>
